<title>Kelola Data — Rekap Tartun</title>
<meta name="description" content="Kelola riwayat snapshot rekonsiliasi yang tersimpan di database.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#f4f2ec; --surface:#fffdf7; --surface-2:#ece8df; --raise:#fffefb;
  --ink:#1b2130; --ink-soft:#565d70; --ink-faint:#898e9c;
  --line:#dcd6c9; --line-soft:#e7e2d6;
  --accent:#2b4a8b; --accent-ink:#213a70; --accent-soft:#e4eaf5;
  --good:#2f7d54; --warn:#916219; --crit:#a83e33; --crit-soft:#f6e1dd; --crit-line:#e7bcb4;
  --shadow:0 1px 2px rgba(24,28,48,.05), 0 3px 10px rgba(24,28,48,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13151c; --surface:#1b1e27; --surface-2:#242835; --raise:#20242f;
  --ink:#e8e9ee; --ink-soft:#a6abba; --ink-faint:#767c8b;
  --line:#31353f; --line-soft:#2a2e37;
  --accent:#84a5e2; --accent-ink:#a9c2ef; --accent-soft:#232c3e;
  --good:#5cba88; --warn:#d3a65e; --crit:#e37b70; --crit-soft:#341f1c; --crit-line:#513029;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 3px 12px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --paper:#13151c; --surface:#1b1e27; --surface-2:#242835; --raise:#20242f;
  --ink:#e8e9ee; --ink-soft:#a6abba; --ink-faint:#767c8b;
  --line:#31353f; --line-soft:#2a2e37;
  --accent:#84a5e2; --accent-ink:#a9c2ef; --accent-soft:#232c3e;
  --good:#5cba88; --warn:#d3a65e; --crit:#e37b70; --crit-soft:#341f1c; --crit-line:#513029;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 3px 12px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; font-size:15px; line-height:1.5}
h1,h2{font-family:"Spectral",Georgia,serif; font-weight:600; margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
a{color:var(--accent-ink)}
header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line-soft)}
.hbar{display:flex; align-items:center; gap:12px; padding:13px 20px; max-width:1160px; margin:0 auto}
.brand{margin-right:auto}
.brand b{font-family:"Spectral",serif; font-weight:700; font-size:19px}
.brand span{font-size:12px; color:var(--ink-faint); display:block}
.hbtn{font:inherit; font-size:13px; padding:7px 12px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:var(--raise); color:var(--ink-soft); text-decoration:none}
.hbtn:hover{border-color:var(--accent); color:var(--accent-ink)}
main{max-width:1160px; margin:0 auto; padding:22px 20px 80px}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; box-shadow:var(--shadow)}
.tile .k{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600}
.tile .v{font-family:"IBM Plex Mono",monospace; font-size:17px; margin-top:6px; overflow-wrap:anywhere}
.bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
.btn{font:inherit; font-size:13px; padding:8px 14px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:var(--raise); color:var(--ink-soft)}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn.danger{color:var(--crit); border-color:var(--crit-line); background:var(--crit-soft)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line-soft); white-space:nowrap; vertical-align:top}
th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); background:var(--surface-2)}
tbody tr:hover{background:var(--surface-2)}
td input{font:inherit; font-size:13px; padding:4px 7px; border-radius:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink)}
td input.dt{width:130px} td input.note{width:210px}
td .row-act{display:flex; gap:5px; flex-wrap:wrap}
.mini{font:inherit; font-size:12px; padding:3px 8px; border-radius:6px; cursor:pointer; border:1px solid var(--line); background:var(--raise); color:var(--ink-soft)}
.mini:hover{border-color:var(--accent); color:var(--accent-ink)}
.mini.on{background:var(--accent); border-color:var(--accent); color:#fff}
.mini.del{color:var(--crit); border-color:var(--crit-line)}
.flags{font-size:12px; color:var(--ink-soft)}
.flags .ok{color:var(--good)} .flags .bad{color:var(--crit)}
.detail td{background:var(--paper)}
.detail .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; padding:6px 0}
.detail h3{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 4px}
.detail textarea{width:100%; height:150px; font-family:"IBM Plex Mono",monospace; font-size:11px; padding:8px; border-radius:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink); resize:vertical}
.empty{padding:26px; text-align:center; color:var(--ink-faint); font-style:italic}
.msg{font-size:13px; margin-left:6px}
.msg.err{color:var(--crit)} .msg.ok{color:var(--good)}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-size:13px; padding:9px 16px; border-radius:8px; z-index:50}
.toast[hidden]{display:none}
.modal[hidden]{display:none}
.modal{position:fixed; inset:0; z-index:40; background:rgba(15,18,30,.5); display:flex; align-items:center; justify-content:center; padding:20px}
.modal-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); width:min(460px,100%); padding:18px}
.modal-box h2{font-size:16px; margin-bottom:8px}
.modal-box p{font-size:13.5px; color:var(--ink-soft); margin:0 0 12px}
.modal-box input{width:100%; font:inherit; padding:8px 11px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); margin-bottom:12px}
.modal-act{display:flex; gap:8px; justify-content:flex-end}
</style>

<header>
  <div class="hbar">
    <div class="brand"><b>Kelola Data</b><span>Riwayat snapshot rekonsiliasi</span></div>
    <a class="hbtn" href="/">← Rekonsiliasi</a>
    <button class="hbtn" id="themeBtn">Tema</button>
  </div>
</header>

<main>
  <div class="tiles" id="tiles"></div>
  <div class="bar">
    <button class="btn" id="reload">Muat ulang</button>
    <span style="flex:1"></span>
    <button class="btn danger" id="wipe">Hapus semua data</button>
  </div>
  <div class="card">
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>ID</th><th>Tanggal</th><th>Catatan</th><th>Ringkasan</th>
          <th class="num">Ukuran</th><th>Dibuat</th><th>Aksi</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>Belum ada data tersimpan.</div>
  </div>
</main>

<div class="modal" id="wipeModal" hidden>
  <div class="modal-box">
    <h2>Hapus semua data</h2>
    <p>Semua snapshot akan dihapus permanen. Ketik <b>HAPUS SEMUA</b> untuk melanjutkan.</p>
    <input id="wipeInput" placeholder="HAPUS SEMUA" spellcheck="false">
    <div class="modal-act">
      <button class="btn" id="wipeCancel">Batal</button>
      <button class="btn danger" id="wipeGo">Hapus permanen</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,txt) => { const e = document.createElement(t); if(c) e.className = c; if(txt != null) e.textContent = txt; return e; };
const fmt = n => new Intl.NumberFormat('id-ID').format(n);
function bytes(n){ if(n < 1024) return n + ' B'; if(n < 1048576) return (n/1024).toFixed(1) + ' KB'; return (n/1048576).toFixed(2) + ' MB'; }
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

(function(){ try{ const t = localStorage.getItem('rt-theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){} })();
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('rt-theme', next); }catch(e){}
};

async function api(path, opts){
  const r = await fetch('/api' + path, opts);
  if(r.status === 401){ location.href = '/'; throw new Error('Perlu login'); }
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || ('Gagal (' + r.status + ')'));
  return d;
}

function flagText(s){
  s = s || {};
  if(!s.banks) return '—';
  return Object.entries(s.banks).map(([k,v]) => {
    const n = (v.tidakN||0) + (v.unN||0);
    return '<span class="' + (n===0?'ok':'bad') + '">' + k + ' ' + (n===0?'✓':n) + '</span>';
  }).join(' &nbsp; ');
}

let DATA = [];
async function load(){
  const [info, list] = await Promise.all([ api('/db/info'), api('/snapshots?full=1') ]);
  DATA = list;
  $('#tiles').innerHTML = '';
  const tiles = [
    ['Snapshot', fmt(info.rows)],
    ['Ukuran file', bytes(info.bytes)],
    ['Rentang tanggal', info.tanggal_min ? (info.tanggal_min === info.tanggal_max ? info.tanggal_min : info.tanggal_min + ' → ' + info.tanggal_max) : '—'],
    ['Lokasi file', info.path],
  ];
  tiles.forEach(([k,v]) => { const d = el('div','tile'); d.append(el('div','k',k), el('div','v',v)); $('#tiles').append(d); });

  const tb = $('#rows'); tb.innerHTML = '';
  $('#empty').hidden = list.length > 0;
  list.forEach(r => tb.append(rowEl(r)));
}

function rowEl(r){
  const tr = el('tr');
  tr.append(Object.assign(el('td','num'), { textContent:r.id }));

  const tdDate = el('td');
  const inDate = el('input','dt'); inDate.type = 'date'; inDate.value = r.tanggal;
  tdDate.append(inDate); tr.append(tdDate);

  const tdNote = el('td');
  const inNote = el('input','note'); inNote.type = 'text'; inNote.value = r.catatan; inNote.placeholder = '—'; inNote.maxLength = 200;
  tdNote.append(inNote); tr.append(tdNote);

  tr.append(Object.assign(el('td','flags'), { innerHTML: flagText(r.ringkasan) + (r.ringkasan && r.ringkasan.otoN ? ' &nbsp;·&nbsp; ' + r.ringkasan.otoN + ' baris' : '') }));
  tr.append(Object.assign(el('td','num'), { textContent: bytes(r.sumber_bytes || 0) }));
  tr.append(Object.assign(el('td','num'), { textContent: String(r.dibuat_pada || '').replace('T',' ').slice(0,16) }));

  const tdAct = el('td');
  const act = el('div','row-act');
  const save = el('button','mini','Simpan');
  save.onclick = async () => {
    try{
      await api('/snapshots/' + r.id, { method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tanggal: inDate.value, catatan: inNote.value }) });
      r.tanggal = inDate.value; r.catatan = inNote.value;
      toast('Tersimpan');
    }catch(e){ toast(e.message); }
  };
  const detail = el('button','mini','Detail');
  const openApp = el('button','mini','Buka di app');
  openApp.onclick = () => { location.href = '/?muat=' + r.id; };
  const del = el('button','mini del','Hapus');
  del.onclick = async () => {
    if(!confirm('Hapus snapshot #' + r.id + ' (' + r.tanggal + ')?')) return;
    try{ await api('/snapshots/' + r.id, { method:'DELETE' }); load(); toast('Dihapus'); }
    catch(e){ toast(e.message); }
  };
  act.append(save, detail, openApp, del);
  tdAct.append(act); tr.append(tdAct);

  let detailTr = null;
  detail.onclick = async () => {
    if(detailTr){ detailTr.remove(); detailTr = null; detail.classList.remove('on'); return; }
    detail.classList.add('on');
    detailTr = el('tr','detail');
    const td = el('td'); td.colSpan = 7; td.textContent = 'Memuat…';
    detailTr.append(td); tr.after(detailTr);
    try{
      const full = await api('/snapshots/' + r.id);
      const s = full.sumber || {};
      td.textContent = '';
      const grid = el('div','grid');
      [['Otomax','oto'],['BRI','bri'],['BCA','bca'],['Mandiri','mdr'],['QRIS BCA','qris']].forEach(([label,key]) => {
        if(!s[key]) return;
        const box = el('div');
        box.append(el('h3',null,label));
        const ta = el('textarea'); ta.readOnly = true; ta.value = s[key];
        box.append(ta); grid.append(box);
      });
      const rj = el('div');
      rj.append(el('h3',null,'Ringkasan (JSON)'));
      const rta = el('textarea'); rta.readOnly = true; rta.value = JSON.stringify(full.ringkasan, null, 2);
      rj.append(rta); grid.append(rj);
      td.append(grid);
    }catch(e){ td.textContent = e.message; }
  };
  return tr;
}

$('#reload').onclick = () => load().then(() => toast('Dimuat ulang'));
$('#wipe').onclick = () => { $('#wipeInput').value = ''; $('#wipeModal').hidden = false; $('#wipeInput').focus(); };
$('#wipeCancel').onclick = () => $('#wipeModal').hidden = true;
$('#wipeModal').onclick = e => { if(e.target.id === 'wipeModal') $('#wipeModal').hidden = true; };
$('#wipeGo').onclick = async () => {
  try{
    const d = await api('/snapshots/hapus-semua', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ konfirmasi: $('#wipeInput').value }) });
    $('#wipeModal').hidden = true;
    toast(d.dihapus + ' snapshot dihapus');
    load();
  }catch(e){ toast(e.message); }
};

load().catch(e => toast(e.message));
</script>
