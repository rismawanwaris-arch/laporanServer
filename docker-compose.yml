services:
  rekap-tartun:
    build: .
    image: rekap-tartun
    container_name: rekap-tartun
    restart: unless-stopped
    ports:
      # Port di sisi host bisa diganti lewat .env (HOST_PORT=...) kalau 3000 sudah dipakai.
      - "${HOST_PORT:-3000}:3000"
    environment:
      # Kosongkan APP_PASSWORD untuk menonaktifkan login.
      APP_PASSWORD: "${APP_PASSWORD:-}"
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
